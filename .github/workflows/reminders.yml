# Optional: sends reminder emails every hour (Vercel's free cron only runs once a day).
# Turn it on by adding two repository secrets in GitHub → Settings → Secrets and variables → Actions:
#   APP_URL      e.g. https://your-app.vercel.app
#   CRON_SECRET  the same value you put in Vercel
# Without those secrets this workflow does nothing.
name: Reminder emails

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call the reminder endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET secrets not set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/reminders"
